# Refreshes data/dashboard-data.json from GoHighLevel every morning.
# Needs repo secrets GHL_API_KEY and GHL_LOCATION_ID
# (Settings → Secrets and variables → Actions). The key never reaches the browser:
# only the cleaned, aggregated JSON is committed.
name: Refresh marketing dashboard data

on:
  schedule:
    - cron: "17 5 * * *"   # every day, 05:17 UTC
  workflow_dispatch:        # "Run workflow" button for an on-demand refresh

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pull, clean and aggregate GoHighLevel data
        env:
          GHL_API_KEY: ${{ secrets.GHL_API_KEY }}
          GHL_LOCATION_ID: ${{ secrets.GHL_LOCATION_ID }}
        run: python3 scripts/build_data.py
      - name: Commit the new numbers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dashboard-data.json
          git diff --cached --quiet || git commit -m "Refresh dashboard data"
          git push
